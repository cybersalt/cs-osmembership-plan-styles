PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES="System - CS OS Membership Plan Styles"
PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_XML_DESCRIPTION="Highlights OS Membership directory entries for members on selected plans (e.g. Premium) by injecting a CSS class on each matching profile link. Runs on the frontend via the onAfterRender system event and stays clear of template overrides so it survives Joomla, OS Membership, and template-rebuild updates."

PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELDSET_BASIC="Basic"
PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELDSET_SUPPORT="Support"

PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_NOTE_INTRO="Select one or more OS Membership plans below. Active subscribers on those plans will have a CSS class added to their directory profile links, which the plugin's default stylesheet bolds. Use the Custom CSS field for further tweaks."

PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELD_PLAN_IDS_LABEL="Highlighted Plans"
PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELD_PLAN_IDS_DESC="Pick one or more OS Membership plans whose members should be highlighted. The plugin only highlights active, published main-record subscribers on these plans."

PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELD_CSS_CLASS_LABEL="CSS Class"
PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELD_CSS_CLASS_DESC="The CSS class added to each matching profile link. Letters, digits, hyphens, and underscores only. Default: cs-osm-premium-member."

PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELD_INJECT_CSS_LABEL="Inject Default Stylesheet"
PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELD_INJECT_CSS_DESC="Inject a &lt;style&gt; block into the page head with a default bold rule (font-weight: 700) for the chosen class. Turn off if your template already provides the styling."

PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELD_CUSTOM_CSS_LABEL="Custom CSS"
PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_FIELD_CUSTOM_CSS_DESC="Optional. Appended to the injected stylesheet. Use it to override the default bold rule, add colour, or style the parent row."

PLG_SYSTEM_CSOSMEMBERSHIPPLANSTYLES_NOTE_SUPPORT="Support: <a href=\"mailto:support@cybersalt.com\">support@cybersalt.com</a> &middot; <a href=\"https://www.cybersalt.com/services/support-request-form\" target=\"_blank\" rel=\"noopener\">cybersalt.com/services/support-request-form</a> &middot; <a href=\"https://github.com/cybersalt/cs-osmembership-plan-styles\" target=\"_blank\" rel=\"noopener\">GitHub repository</a>"
